name: Keep Render instance awake

# Render's free tier spins the service down after ~15 minutes idle, then
# takes 30-50s to cold-start on the next request. This pings /health
# often enough to keep it from ever going idle. GitHub Actions on a
# public repo has unlimited free minutes on hosted runners, so this
# costs nothing. Not a perfect guarantee, GitHub's own scheduler can lag
# by a few minutes under load, but it should eliminate the vast majority
# of cold starts.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sf --max-time 60 https://lobster-maps.onrender.com/health \
            && echo "ok" \
            || echo "ping failed or timed out, not treating as a workflow failure"
