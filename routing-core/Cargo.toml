[package]
name = "lobster-routing"
version = "0.1.0"
edition = "2021"
description = "High-performance routing engine for LobsterMaps using Contraction Hierarchies"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Date::now() in rate_limiter.rs and weather_cache.rs needs this; it was
# used but never declared, so the crate could not compile.
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true

# wasm-opt (binaryen, bundled by wasm-pack) validates the module before
# optimising it, and defaults to a feature set older than what current
# rustc emits for wasm32. Without these flags it rejects the build with
# "Bulk memory operations require bulk memory" and "all used features
# should be allowed" (trunc_sat), which is a validator default, not a
# problem with the module.
#
# Enabling the features explicitly keeps the -O size pass. The
# alternative, `wasm-opt = false`, also builds but ships a bigger .wasm.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    '-O',
    '--enable-bulk-memory',
    '--enable-nontrapping-float-to-int',
    '--enable-sign-ext',
    '--enable-mutable-globals',
]
