[package]
name = "lobster-routing"
version = "0.1.0"
edition = "2021"
description = "High-performance routing engine for LobsterMaps using Contraction Hierarchies"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true
