services:
  - type: web
    name: lobster-maps
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: https://lobster-maps.onrender.com
