name: Deploy Routing Engine

on:
  push:
    branches: [main]
    paths:
      - 'server/src/**'
      - 'server/package.json'
      - 'client/src/**'
      - '.github/workflows/deploy.yml'

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: cd server && npm install
      
      - name: Verify TypeScript
        run: cd server && npx tsc --noEmit
      
      - name: Run tests (if any)
        run: cd server && npm test -- --passWithNoTests

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: cd client && npm install
      
      - name: Build client
        run: cd client && npm run build

  deploy:
    needs: [test-server, test-client]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": true}'
          else
            echo "⚠️  Render deploy hook not configured. Set RENDER_DEPLOY_HOOK in GitHub secrets."
          fi
      
      - name: Check deployment status
        run: |
          echo "✓ Deployment triggered"
          echo "Monitor at: https://dashboard.render.com/services/srv-da77r72d0e5s73dl976g"
